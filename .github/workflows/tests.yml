name: Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 1742 tests, CPU-bound: about 14 minutes on an M-series Mac, slower on hosted runners.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 3.13 only: the P4 gate compares AST hashes of installed sources and the
        # allowlisted hashes are generated with 3.13, so its audit tests fail on
        # 3.11 even though the runtime itself imports there. See README Limitations.
        python-version: ["3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ripgrep
        # dev_manifest reconciliation shells out to rg; ten tests need it.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - name: Install
        run: |
          python3 -m pip install -e .
          python3 -m pip install 'pytest>=8'
      - name: Test
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider
