[project]
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["python", "personal-knowledge-management", "workflow-automation", "ai-agents", "human-in-the-loop", "local-first"]
name = "tool-life-os-runtime"
version = "0.1.0"
description = "Filesystem runtime for a personal Life OS with flows, human gates, and independent CLI tools"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lifeos = "tool_life_os_runtime.cli:main"
tool-life-os-runtime = "tool_life_os_runtime.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tool_life_os_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fresh_inode: needs a filesystem that does not reuse an inode number right after unlink",
]

[project.urls]
Repository = "https://github.com/abetor/life-os-runtime"
Documentation = "https://github.com/abetor/life-os-runtime#readme"
Issues = "https://github.com/abetor/life-os-runtime/issues"
